name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"

jobs:
  quality:
    name: lint, architecture, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: make lint
      # The layer rules are a build failure, not a README paragraph.
      - run: make arch
      # No `continue-on-error`. A type check that cannot fail the build is
      # documentation that happens to execute.
      - run: make types
      # The published contract is an artefact under review, like a migration.
      # Drift here means the API changed and the document consumers build
      # against did not.
      - name: openapi.json matches the application
        run: make schema-check

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: evenkeel
          POSTGRES_PASSWORD: evenkeel
          POSTGRES_DB: evenkeel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # Both are present, so the suites that would otherwise skip run against
      # the real thing. The contract tests exist to keep the in-memory adapters
      # honest, and they can only do that when the real adapter is reachable.
      TEST_REDIS_URL: redis://localhost:6379/0
      # A service container rather than testcontainers: the runner already has
      # a healthy Postgres, and starting a second one inside Docker just to
      # reach the same database costs time for nothing. Locally, with no
      # TEST_DATABASE_URL set, testcontainers takes over.
      TEST_DATABASE_URL: postgresql+asyncpg://evenkeel:evenkeel@localhost:5432/evenkeel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  migrations:
    name: migration round-trip and drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: evenkeel
          POSTGRES_PASSWORD: evenkeel
          POSTGRES_DB: evenkeel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP__DATABASE__HOST: localhost
      APP__DATABASE__USER: evenkeel
      APP__DATABASE__PASSWORD: evenkeel
      APP__DATABASE__DATABASE: evenkeel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras

      # Migrations get their first real execution here, not against production.
      - name: upgrade
        run: uv run alembic upgrade head
      - name: downgrade to base
        run: uv run alembic downgrade base
      - name: upgrade again
        run: uv run alembic upgrade head

      # Two heads means two branches added migrations independently and nobody
      # merged them. `upgrade head` then fails on a fresh database while working
      # fine on every machine that already ran one of the branches.
      - name: exactly one migration head
        run: |
          heads=$(uv run alembic heads | grep -c . || true)
          echo "heads: $heads"
          test "$heads" -eq 1

      # Catches the model change that never got a migration -- the drift that
      # only surfaces when a production query hits a column that is not there.
      - name: no pending schema drift
        run: uv run alembic check

  security:
    name: secrets, dependencies, code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history: a secret committed and reverted is still
          # published, and scanning only the tip would miss it.
          fetch-depth: 0
      # The official image, not the vendor action. The action couples the scan to
      # a licence check and its own release cadence, and it failed this build
      # while the scan itself found nothing. Running the tool directly means CI
      # executes exactly what `make` and pre-commit run locally — the same
      # principle the rest of this pipeline follows.
      - name: secret scan over full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      # No `--strict`: it fails on any dependency it cannot audit, and the
      # project itself is installed editable and not on PyPI, so the flag makes
      # the job fail permanently for a reason that is not a vulnerability.
      # Without it, real advisories still fail the build and the skip is printed.
      - name: known vulnerabilities in dependencies
        run: uv run pip-audit --skip-editable
      - name: static security analysis
        run: uv run bandit -r src -c pyproject.toml

      # PEP 751 is an interchange format, not a replacement: no tool has made
      # pylock.toml its primary lock, so `uv.lock` stays the source of truth and
      # this is published so nothing here is locked to one installer.
      - name: export a PEP 751 lock
        run: uv export --frozen --format pylock.toml -o pylock.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pylock.toml
          path: pylock.toml

  image:
    name: build and scan image
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      REF_NAME: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: evenkeel:${{ github.sha }}
          # Passed through env rather than interpolated: a ref name is
          # attacker-influenced text, and interpolating such values directly
          # into build args or run steps is the standard workflow-injection
          # foothold.
          build-args: |
            APP_VERSION=${{ env.REF_NAME }}
            APP_COMMIT=${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evenkeel:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: evenkeel:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json

  smoke:
    name: it actually starts
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - name: compose up
        run: docker compose up -d --build --wait
      # A green unit suite proves the code parses. This proves the image boots,
      # migrations apply, and the app can reach its database.
      - name: readiness reports ready
        run: |
          body=$(curl -fsS localhost:8000/ready)
          echo "$body"
          echo "$body" | grep -q '"status":"ready"'
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: compose down
        if: always()
        run: docker compose down -v

  contract:
    name: api compatibility
    runs-on: ubuntu-latest
    # Only on pull requests: the question "does this break a consumer" needs
    # something to compare against, and on a push to main that baseline is the
    # commit that just landed.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: fetch the base contract
        run: git show ${{ github.event.pull_request.base.sha }}:openapi.json > /tmp/base-openapi.json
      # Reports what changed for a consumer, and fails only on the breaking
      # subset. Additive changes are expected and should not block a merge.
      - name: breaking change check
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: /tmp/base-openapi.json
          revision: openapi.json
          fail-on: ERR

  gate:
    name: quality gate
    runs-on: ubuntu-latest
    # `always()` is the whole point. A required check that is *skipped* — because
    # a dependency failed, or a path filter excluded it — is reported to branch
    # protection as neutral, and a pull request can merge with half the pipeline
    # never having run. This job always runs, inspects the others itself, and is
    # the only status branch protection needs to require. Adding or renaming a
    # job then never means reconfiguring the repository.
    if: always()
    needs: [quality, test, migrations, security, image, smoke, contract]
    steps:
      - name: Summarise and decide
        env:
          RESULTS: >-
            quality=${{ needs.quality.result }}
            test=${{ needs.test.result }}
            migrations=${{ needs.migrations.result }}
            security=${{ needs.security.result }}
            image=${{ needs.image.result }}
            smoke=${{ needs.smoke.result }}
            contract=${{ needs.contract.result }}
        run: |
          set -euo pipefail
          failed=0
          {
            echo "| Gate | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry##*=}"
            case "$result" in
              success) icon="✅ passed" ;;
              # `contract` only runs on pull requests, so a skip there is
              # expected rather than a silently-missing gate.
              skipped) icon="⏭️ skipped"
                       [ "$name" = "contract" ] || failed=1 ;;
              *)       icon="❌ $result"; failed=1 ;;
            esac
            echo "| $name | $icon |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more gates did not pass"
            exit 1
          fi
