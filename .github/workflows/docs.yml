name: docs

# The API reference as a link, rather than as something you get after cloning
# the repository and starting the stack. Same renderer the app serves at
# `/scalar`, same committed `openapi.json`.
on:
  push:
    branches: [main]
    # Path-filtered: a docs deploy on every README typo is a queue of no-op
    # deployments hiding the real one.
    paths:
      - "openapi.json"
      - "src/**"
      - "tools/build_docs.py"
      - "tools/dump_openapi.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-published site
# is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      # Regenerates the spec and refuses to publish if it disagrees with the
      # application, so a page that deploys is also proof the document is
      # current. Same check `make schema-check` makes in the other pipeline.
      - run: uv run python tools/build_docs.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
