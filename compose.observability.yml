# The observability stack `compose.yml` refers to. An overlay rather than a
# profile, because it is the one part of the stack that is worth reading on its
# own — and because bringing it up should be a deliberate act:
#
#   METRICS_ENABLED=true docker compose \
#     -f compose.yml -f compose.observability.yml up -d --wait
#
# Nothing here is production configuration. Grafana runs without a login and
# Prometheus keeps a few hours of data in a container volume; both are local
# conveniences, and both are bound to loopback for the same reason the rest of
# the stack is.
services:
  api:
    environment:
      # The dashboards are empty without it, and the default is off — so
      # forgetting this is the most likely way to conclude that the stack is
      # broken when it is merely silent.
      APP__OBSERVABILITY__METRICS_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A load run is twenty seconds; nothing here needs a fortnight of it.
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # No login on a stack that holds no data and listens on loopback. The
      # alternative is that the first thing this template asks of a reader is
      # `admin`/`admin`, followed by a password change dialog.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      # Land on the dashboard rather than on an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/evenkeel.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Only reachable when the `render` profile is up; harmless otherwise.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # `--profile render` only. It exists so the dashboard image in the README is
  # regenerated by a command rather than pasted from somebody's laptop, which
  # is how a screenshot ends up showing panels the dashboard no longer has.
  # Half a gigabyte of headless Chromium, so it is not pulled by default.
  renderer:
    profiles: [render]
    image: grafana/grafana-image-renderer:3.12.6
    environment:
      RENDERING_VERBOSE_LOGGING: "false"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
