# `docker compose up` gives a working API with no credentials and no external
# services. Everything optional is a profile: `--profile redis`, and the
# observability stack lives in its own file.
services:
  api:
    build:
      context: .
      target: runtime
    environment:
      APP__DATABASE__HOST: db
      APP__DATABASE__USER: evenkeel
      APP__DATABASE__PASSWORD: evenkeel
      APP__DATABASE__DATABASE: evenkeel
      # Asked for explicitly. The default is `production`, so an image deployed
      # without configuration gets the strict posture instead of this one.
      APP__APP__ENVIRONMENT: local
      APP__APP__LOGGING__JSON_LOGS: "false"
      # Outbound risk assessment is off by default: `allow-all` is a real
      # adapter that answers instantly, so the template needs no third party.
      # `docker compose --profile load up` starts the stub below and points
      # this at it — see tools/load/README.md.
      APP__RISK__PROVIDER: ${RISK_PROVIDER:-allow-all}
      APP__RISK__BASE_URL: ${RISK_BASE_URL:-http://risk:9800}
      APP__RISK__HTTP__BULKHEAD_LIMIT: ${RISK_BULKHEAD_LIMIT:-32}
      APP__RISK__HTTP__TOTAL_TIMEOUT_MS: ${RISK_TIMEOUT_MS:-800}
      APP__MOVEMENTS__RATE_LIMIT_LIMIT: ${RATE_LIMIT:-30}
      # `/metrics` in Prometheus format. Off by default; the load profile turns
      # it on, because a load run without it cannot tell a shed request from a
      # timed-out one.
      APP__OBSERVABILITY__METRICS_ENABLED: ${METRICS_ENABLED:-false}
    ports:
      # Bound to loopback. Publishing on 0.0.0.0 exposes a development stack --
      # debug on, docs open, default password -- to the whole local network and,
      # on a cloud host, to the internet.
      #
      # And off 8000, for the reason already written against the database port
      # below: 8000 is the port every other local API is already using, so a
      # template that grabs it greets a stranger with a Docker networking error
      # instead of a working service. That is not hypothetical -- it is what a
      # cold-start run of the documented commands did on the machine this was
      # written on.
      - "127.0.0.1:${API_PORT:-58000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Long enough for in-flight requests to finish before SIGKILL; must exceed
    # the server's own graceful-shutdown budget.
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

  # Only with `--profile load`: a test double for the outbound provider, with a
  # dial for how badly it behaves. Deliberately not wired into `depends_on` —
  # the service is supposed to survive this being absent, and a hard dependency
  # would hide exactly the behaviour the load run exists to show.
  risk:
    profiles: [load]
    # The application image, which already carries aiohttp through the
    # `outbound` extra. Installing it at container start instead cost about ten
    # seconds of the stub not listening, and the first load run blamed the
    # resulting connection errors on the slow-provider scenario it was supposed
    # to be measuring.
    build:
      context: .
      target: runtime
    volumes:
      - ./tools/load:/opt/load:ro
    command: ["python", "/opt/load/risk_provider.py"]
    # Its own, because the application image's healthcheck probes port 8000 and
    # this stub listens on 9800. Inherited it is permanently unhealthy, which
    # made `--wait` fail on the command in tools/load/README.md; disabled
    # instead, `--wait` refuses a service with no healthcheck at all.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:9800/health',timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      LATENCY_MS: ${RISK_LATENCY_MS:-5}
      JITTER_MS: ${RISK_JITTER_MS:-0}
      FAILURE_RATE: ${RISK_FAILURE_RATE:-0}
      REFUSE_RATE: ${RISK_REFUSE_RATE:-0}
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      APP__DATABASE__HOST: db
      APP__DATABASE__USER: evenkeel
      APP__DATABASE__PASSWORD: evenkeel
      APP__DATABASE__DATABASE: evenkeel
    depends_on:
      db:
        condition: service_healthy
    # A one-shot that the API waits on, rather than migrations racing N replicas
    # at startup.
    restart: "no"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: evenkeel
      POSTGRES_PASSWORD: evenkeel
      POSTGRES_DB: evenkeel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Off the default port on purpose: a template that grabs 5432 collides
      # with whatever Postgres the machine is already running, and the first
      # experience of it is a port conflict instead of a working API.
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      # The API's `depends_on` waits for this, so "started" never means
      # "accepting queries" -- the classic first-boot crash loop.
      test: ["CMD-SHELL", "pg_isready -U evenkeel -d evenkeel"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

  redis:
    profiles: [redis]
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
