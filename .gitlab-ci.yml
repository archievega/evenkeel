# Mirror of .github/workflows/ci.yml. Both pipelines run the same commands;
# when they drift, the Makefile targets are the source of truth.
stages: [quality, verify, package]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv/]

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHONUNBUFFERED: "1"

.python:
  before_script:
    - uv sync --frozen --all-extras

lint:
  stage: quality
  extends: .python
  script:
    - uv run ruff format --check src tests
    - uv run ruff check src tests

architecture:
  stage: quality
  extends: .python
  script:
    - uv run lint-imports

types:
  stage: quality
  extends: .python
  script:
    - uv run mypy src

test:
  stage: verify
  extends: .python
  services:
    - name: redis:7.4-alpine
      alias: redis
  variables:
    TEST_REDIS_URL: "redis://redis:6379/0"
  script:
    - uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
  coverage: '/TOTAL.*\s(\d+%)$/'

migrations:
  stage: verify
  extends: .python
  services:
    - name: postgres:17.4-alpine
      alias: postgres
  variables:
    POSTGRES_USER: evenkeel
    POSTGRES_PASSWORD: evenkeel
    POSTGRES_DB: evenkeel
    APP__DATABASE__HOST: postgres
    APP__DATABASE__USER: evenkeel
    APP__DATABASE__PASSWORD: evenkeel
    APP__DATABASE__DATABASE: evenkeel
  script:
    - uv run alembic upgrade head
    - uv run alembic downgrade base
    - uv run alembic upgrade head
    - uv run alembic check

security:
  stage: verify
  extends: .python
  script:
    - uv run pip-audit --strict
    - uv run bandit -r src -c pyproject.toml

image:
  stage: package
  image: docker:27.4.1-cli
  services:
    - docker:27.4.1-dind
  variables:
    # TLS between the job and the daemon. Disabling it (DOCKER_TLS_CERTDIR: "")
    # puts an unauthenticated Docker socket on the runner network, which is
    # full control of the daemon for anything else sharing it.
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker build --target runtime
      --build-arg APP_COMMIT=$CI_COMMIT_SHA
      --build-arg APP_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}
      -t evenkeel:$CI_COMMIT_SHA .
